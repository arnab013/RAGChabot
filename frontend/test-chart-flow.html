<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Data Flow Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2a2a2a;
        }
        button {
            background: #06b6d4;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0891b2;
        }
        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .result {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🧪 Chart Data Flow Testing</h1>
    
    <div class="test-section">
        <h2>Backend API Testing</h2>
        <p>Test different chart-generating queries to verify backend responses:</p>
        
        <button onclick="testQuery('Show SDG distribution across patents')">📊 Bar Chart Test</button>
        <button onclick="testQuery('Show publication trends over the last 10 years')">📈 Line Chart Test</button>
        <button onclick="testQuery('Show percentage distribution of patents by SDG')">🥧 Pie Chart Test</button>
        <button onclick="testQuery('Show cumulative patent growth over time')">📉 Area Chart Test</button>
        <button onclick="testQuery('Show stacked bar chart of SDG patents by year')">📊 Stacked Bar Test</button>
        <button onclick="testQuery('Create a treemap of patent technology categories')">🌳 Treemap Test</button>
        
        <div id="apiResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Chart Data Analysis</h2>
        <div id="chartAnalysis"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Results Summary</h2>
        <div id="testSummary"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        let testResults = [];

        async function testQuery(query) {
            const resultDiv = document.getElementById('apiResult');
            const analysisDiv = document.getElementById('chartAnalysis');
            
            resultDiv.innerHTML = `<p>🔄 Testing query: "${query}"</p>`;
            
            try {
                const response = await fetch(`${API_BASE}/api/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query }),
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Display raw response
                resultDiv.innerHTML = `
                    <h3>✅ API Response:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                // Analyze chart data
                analyzeChartData(data, query);
                
                // Record test result
                testResults.push({
                    query: query,
                    hasChart: !!data.chart,
                    chartType: data.chart?.type,
                    dataStructure: data.chart?.data ? Object.keys(data.chart.data) : null,
                    success: true
                });
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>❌ Error:</h3>
                    <pre>${error.message}</pre>
                `;
                
                testResults.push({
                    query: query,
                    error: error.message,
                    success: false
                });
            }
            
            updateTestSummary();
        }
        
        function analyzeChartData(apiResponse, query) {
            const analysisDiv = document.getElementById('chartAnalysis');
            
            if (!apiResponse.chart) {
                analysisDiv.innerHTML = `
                    <h3>📊 Chart Analysis:</h3>
                    <p>❌ No chart data returned for query: "${query}"</p>
                `;
                return;
            }
            
            const chart = apiResponse.chart;
            let analysis = [`<h3>📊 Chart Analysis for: "${query}"</h3>`];
            
            analysis.push(`<p><strong>Chart Type:</strong> ${chart.type}</p>`);
            analysis.push(`<p><strong>Title:</strong> ${chart.title}</p>`);
            
            if (chart.data) {
                if (chart.data.labels && chart.data.datasets) {
                    // Chart.js format
                    analysis.push(`<p><strong>Data Format:</strong> Chart.js (labels + datasets)</p>`);
                    analysis.push(`<p><strong>Labels:</strong> ${chart.data.labels.length} items</p>`);
                    analysis.push(`<p><strong>Datasets:</strong> ${chart.data.datasets.length} series</p>`);
                    
                    if (chart.data.labels.length > 0) {
                        analysis.push(`<p><strong>Sample Labels:</strong> ${chart.data.labels.slice(0, 3).join(', ')}${chart.data.labels.length > 3 ? '...' : ''}</p>`);
                    }
                } else if (Array.isArray(chart.data)) {
                    // Direct array format (treemap, etc.)
                    analysis.push(`<p><strong>Data Format:</strong> Array of objects</p>`);
                    analysis.push(`<p><strong>Data Points:</strong> ${chart.data.length} items</p>`);
                    
                    if (chart.data.length > 0) {
                        analysis.push(`<p><strong>Data Keys:</strong> ${Object.keys(chart.data[0]).join(', ')}</p>`);
                    }
                } else {
                    analysis.push(`<p><strong>Data Format:</strong> Unknown structure</p>`);
                }
                
                // Test data transformation
                const transformedData = testDataTransformation(chart.data);
                analysis.push(`<p><strong>Frontend Transformation:</strong> ${transformedData.success ? '✅ Success' : '❌ Failed'}</p>`);
                if (!transformedData.success) {
                    analysis.push(`<p><strong>Transformation Error:</strong> ${transformedData.error}</p>`);
                }
            }
            
            analysisDiv.innerHTML = analysis.join('');
        }
        
        function testDataTransformation(backendData) {
            try {
                // Simulate the frontend transformation logic
                if (Array.isArray(backendData) && backendData.length > 0 && typeof backendData[0] === 'object') {
                    return { success: true, result: backendData };
                }
                
                if (backendData.labels && backendData.datasets) {
                    const labels = backendData.labels || [];
                    const datasets = backendData.datasets || [];
                    
                    if (datasets.length === 0) return { success: true, result: [] };
                    
                    const transformed = labels.map((label, index) => {
                        const dataPoint = { category: label };
                        datasets.forEach((dataset, datasetIndex) => {
                            const key = dataset.label || `value${datasetIndex}`;
                            const value = dataset.data?.[index];
                            dataPoint[key] = isNaN(Number(value)) ? value : Number(value);
                        });
                        return dataPoint;
                    });
                    
                    return { success: true, result: transformed };
                }
                
                if (typeof backendData === 'object' && !Array.isArray(backendData)) {
                    const transformed = Object.entries(backendData).map(([key, value]) => ({
                        category: key,
                        value: typeof value === 'number' ? value : Number(value) || 0
                    }));
                    return { success: true, result: transformed };
                }
                
                return { success: false, error: 'Unknown data format' };
                
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        function updateTestSummary() {
            const summaryDiv = document.getElementById('testSummary');
            
            if (testResults.length === 0) {
                summaryDiv.innerHTML = '<p>No tests run yet</p>';
                return;
            }
            
            const successful = testResults.filter(r => r.success);
            const withCharts = testResults.filter(r => r.hasChart);
            const chartTypes = [...new Set(testResults.filter(r => r.chartType).map(r => r.chartType))];
            
            summaryDiv.innerHTML = `
                <h3>📈 Test Results Summary</h3>
                <ul>
                    <li><strong>Total Tests:</strong> ${testResults.length}</li>
                    <li><strong>Successful:</strong> ${successful.length}/${testResults.length}</li>
                    <li><strong>With Charts:</strong> ${withCharts.length}/${testResults.length}</li>
                    <li><strong>Chart Types Found:</strong> ${chartTypes.join(', ') || 'None'}</li>
                </ul>
                
                <h4>Individual Test Results:</h4>
                <ul>
                    ${testResults.map(result => `
                        <li>
                            ${result.success ? '✅' : '❌'} 
                            "${result.query.substring(0, 50)}..." 
                            ${result.chartType ? `[${result.chartType}]` : '[No chart]'}
                            ${result.error ? `- Error: ${result.error}` : ''}
                        </li>
                    `).join('')}
                </ul>
            `;
        }
        
        // Initial setup
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🧪 Chart Data Flow Test Interface Loaded');
            console.log('Backend should be running on:', API_BASE);
            updateTestSummary();
        });
    </script>
</body>
</html>
